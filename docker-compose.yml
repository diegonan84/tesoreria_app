services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: tesoreria_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tesoreria_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/tesoreria_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-cambiar_esta_clave_secreta}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
    volumes:
      - uploads_fotos:/app/frontend/fotos
      - uploads_manuales:/app/frontend/manuales
      - uploads_notas:/app/frontend/notas
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads_fotos:
  uploads_manuales:
  uploads_notas: