<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Control de Fichadas</title>
    <link rel="stylesheet" href="/archivos/css/styles.css">
</head>
<body>

    <nav class="navbar-ba" id="global-navbar"></nav>
    <aside class="sidebar-ba" id="global-sidebar"></aside>
    <div id="global-chat" class="chat-widget"></div>

    <main class="dashboard-body">
        <h2>Control de Fichadas</h2>
            <p>Panel de control de asistencia del personal.</p>
            
            <div class="card" style="margin-top: 20px; padding: 20px;">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Empleado</th>
                            <th>Estado</th>
                            <th>Hora de Ingreso</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-fichadas">
                        <!-- Los datos se cargarán por JS -->
                    </tbody>
                </table>
            </div>
    </main>
    <script src="/archivos/js/app.js"></script>
    <script src="/archivos/js/notificaciones.js"></script>
    <script src="/archivos/js/chat.js"></script>
</body>
</html>
