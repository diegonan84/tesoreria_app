<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <link rel="stylesheet" href="/archivos/css/login.css">
</head>
<body>
    <div class="contenedor-auth">
        <div class="panel-izquierdo">
            <span class="subtitulo-bienvenida">Gestión de Identidades</span>
            <h1 class="titulo-bienvenida">REGISTRO</h1>
            <div class="linea-separadora"></div>
            <div class="seccion-novedades">
                <h4>Alta de Usuarios</h4>
                <p>Complete sus datos reales para solicitar acceso a los módulos.</p>
            </div>
        </div>
        <div class="panel-derecho">
            <h3 style="margin-bottom:10px;">Crear cuenta</h3>
            <div class="grupo-input"><input type="text" id="reg-nombre" placeholder="Nombre"></div>
            <div class="grupo-input"><input type="text" id="reg-apellido" placeholder="Apellido"></div>
            <div class="grupo-input"><input type="text" id="reg-cuil" placeholder="CUIL (XX-XXXXXXXX-X)"></div>
            <div class="grupo-input"><input type="text" id="reg-reparticion" placeholder="Repartición"></div>
            <div class="grupo-input"><input type="email" id="reg-email" placeholder="Email"></div>
            <div class="grupo-input"><input type="password" id="reg-password" placeholder="Contraseña (Mín. 8)"></div>
            <div class="grupo-input"><input type="password" id="reg-confirm" placeholder="Confirmar Contraseña"></div>
            
            <button id="btn-reg" class="btn-ingresar" onclick="registrarUsuario()">REGISTRARSE</button>
            <p id="mensaje-registro" class="mensaje-error"></p>
            <div class="enlace-registro">¿Ya tienes cuenta? <a href="/login">Inicia Sesión</a></div>
        </div>
    </div>
    <script src="/archivos/js/app.js"></script>
    <script src="/archivos/js/auth.js"></script>
</body>
</html>
