<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña</title>
    <link rel="stylesheet" href="/archivos/css/login.css">
</head>
<body>
    <nav class="navbar-ba" id="global-navbar"></nav>
    <aside class="sidebar-ba" id="global-sidebar"></aside>
    <div id="global-chat" class="chat-widget"></div>
    <div class="contenedor-auth">
        <div class="panel-izquierdo">
            <h1 class="titulo-bienvenida">SEGURIDAD</h1>
            <div class="linea-separadora"></div>
            <p>Le enviaremos un enlace temporal seguro para restaurar su acceso.</p>
        </div>
        <div class="panel-derecho">
            <h3>Recuperar Contraseña</h3>
            <p style="font-size: 14px; color: #666; margin-bottom: 20px; text-align: center;">Ingrese el correo asociado a su cuenta.</p>
            <div class="grupo-input"><input type="email" id="forgot-email" placeholder="Correo Electrónico"></div>
            <button id="btn-forgot" class="btn-ingresar" onclick="solicitarRecuperacion()">ENVIAR ENLACE</button>
            <p id="mensaje-forgot" class="mensaje-error"></p>
            <div class="enlace-registro"><a href="/login">Volver al Login</a></div>
        </div>
    </div>
    <script src="/archivos/js/app.js"></script>
    <script src="/archivos/js/auth.js"></script>
</body>
</html>
