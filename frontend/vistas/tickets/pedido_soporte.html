<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido a Soporte | Tesorería</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; background: #eef2f3;
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
            color: #33444b; display: flex; justify-content: center; align-items: flex-start;
            padding: 40px 16px;
        }
        .tarjeta {
            background: #fff; border-radius: 10px; padding: 22px 24px; width: 540px; max-width: 100%;
            box-shadow: 0 8px 28px rgba(10, 30, 40, .12);
        }
        h1 { margin: 0; font-size: 22px; color: #1a3644; }
        .sub { margin: 4px 0 6px; font-size: 13.5px; color: #6b7b82; }
        label { display: block; font-size: 12.5px; font-weight: 600; color: #33444b; margin: 14px 0 5px; }
        .req { color: #b03a2e; }
        input, select, textarea {
            width: 100%; padding: 9px 10px; border: 1px solid #ccd5d9; border-radius: 4px;
            font-family: inherit; font-size: 14px; background: #fff; color: #222;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #58a598; box-shadow: 0 0 0 2px rgba(88,165,152,.15); }
        textarea { resize: vertical; min-height: 110px; }
        .fila2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        @media (max-width: 480px) { .fila2 { grid-template-columns: 1fr; gap: 0; } }
        .acciones { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
        .btn { border: none; border-radius: 4px; padding: 10px 18px; cursor: pointer; font-family: inherit; font-size: 13.5px; font-weight: 600; }
        .btn.primario { background: #1a3644; color: #fff; }
        .btn.primario:hover { background: #0b3a47; }
        .btn.ghost { background: transparent; color: #1a3644; border: 1px solid #c9d3d7; }
        .btn.ghost:hover { border-color: #1a3644; }
        .btn:disabled { opacity: .55; cursor: default; }
        .error { display: none; margin-top: 14px; padding: 9px 12px; border-radius: 4px; background: #fbeceb; color: #b03a2e; font-size: 13px; }
        .trampa { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
        .exito { display: none; text-align: center; padding: 18px 0 6px; }
        .exito .num { font-size: 26px; font-weight: 700; color: #58a598; margin: 10px 0; }
        .exito p { color: #6b7b82; font-size: 14px; }
    </style>
</head>
<body>
    <div class="tarjeta">
        <div id="vista-form">
            <h1>Nuevo ticket</h1>
            <p class="sub">Contanos qué pasa y Soporte se va a ocupar.</p>

            <form id="form-ticket" novalidate>
                <div class="fila2">
                    <div>
                        <label for="f-nombre">Nombre y apellido <span class="req">*</span></label>
                        <input type="text" id="f-nombre" required minlength="2" maxlength="120" autocomplete="name" placeholder="Ej: María Gómez">
                    </div>
                    <div>
                        <label for="f-puesto">Puesto <span class="req">*</span></label>
                        <input type="text" id="f-puesto" required maxlength="120" list="lista-puestos" placeholder="Ej: 12">
                        <datalist id="lista-puestos"></datalist>
                    </div>
                </div>

                <label for="f-titulo">Asunto <span class="req">*</span></label>
                <input type="text" id="f-titulo" required minlength="3" maxlength="150" placeholder="Ej: La impresora del 3er piso no imprime">

                <label for="f-categoria">Categoría</label>
                <select id="f-categoria"><option value="Otro">Otro</option></select>

                <label for="f-descripcion">Descripción <span class="req">*</span></label>
                <textarea id="f-descripcion" required minlength="3" maxlength="4000" placeholder="¿Qué estabas haciendo? ¿Qué mensaje aparece? ¿Desde cuándo pasa?"></textarea>

                <!-- Campo trampa anti-spam: no completar -->
                <div class="trampa" aria-hidden="true">
                    <label for="f-web">Web</label>
                    <input type="text" id="f-web" tabindex="-1" autocomplete="off">
                </div>

                <div class="error" id="error"></div>

                <div class="acciones">
                    <button type="reset" class="btn ghost">Limpiar</button>
                    <button type="submit" class="btn primario" id="btn-enviar">Crear ticket</button>
                </div>
            </form>
        </div>

        <div class="exito" id="vista-exito">
            <h1>¡Ticket enviado!</h1>
            <div class="num" id="numero-ticket"></div>
            <p>Guardá este número por si necesitás consultarlo. Soporte ya lo recibió.</p>
            <button class="btn primario" onclick="otroTicket()">Cargar otro ticket</button>
        </div>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);

        async function cargarCatalogos() {
            try {
                const r = await fetch("/api/tickets-publico/catalogos");
                if (!r.ok) return;
                const d = await r.json();
                const sel = $("f-categoria");
                sel.innerHTML = "";
                (d.categorias || ["Otro"]).forEach(c => sel.add(new Option(c, c, c === "Otro", c === "Otro")));
                const lista = $("lista-puestos");
                (d.puestos || []).forEach(p => { const o = document.createElement("option"); o.value = p; lista.appendChild(o); });
            } catch (e) { /* si falla, queda "Otro" y puesto libre */ }
        }

        function mostrarError(msg) {
            const e = $("error");
            e.textContent = msg;
            e.style.display = msg ? "block" : "none";
        }

        $("form-ticket").addEventListener("submit", async (ev) => {
            ev.preventDefault();
            mostrarError("");
            const datos = {
                nombre: $("f-nombre").value.trim(),
                puesto: $("f-puesto").value.trim(),
                titulo: $("f-titulo").value.trim(),
                categoria: $("f-categoria").value,
                descripcion: $("f-descripcion").value.trim(),
                web: $("f-web").value,
            };
            if (datos.nombre.length < 2) { mostrarError("Ingresá tu nombre."); $("f-nombre").focus(); return; }
            if (!datos.puesto) { mostrarError("Ingresá tu puesto."); $("f-puesto").focus(); return; }
            if (datos.titulo.length < 3) { mostrarError("Completá el asunto (mínimo 3 caracteres)."); $("f-titulo").focus(); return; }
            if (datos.descripcion.length < 3) { mostrarError("Completá la descripción."); $("f-descripcion").focus(); return; }

            const btn = $("btn-enviar");
            btn.disabled = true; btn.textContent = "Enviando…";
            try {
                const r = await fetch("/api/tickets-publico", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(datos),
                });
                const res = await r.json().catch(() => ({}));
                if (!r.ok) {
                    const det = Array.isArray(res.detail) ? "Revisá los datos ingresados." : (res.detail || "No se pudo enviar el ticket.");
                    mostrarError(det);
                    return;
                }
                // Recordamos nombre y puesto para el próximo pedido
                try { localStorage.setItem("pedido_soporte_persona", JSON.stringify({ nombre: datos.nombre, puesto: datos.puesto })); } catch (e) {}
                $("numero-ticket").textContent = res.numero;
                $("vista-form").style.display = "none";
                $("vista-exito").style.display = "block";
            } catch (e) {
                mostrarError("No hay conexión con el servidor. Probá de nuevo en un momento.");
            } finally {
                btn.disabled = false; btn.textContent = "Crear ticket";
            }
        });

        function otroTicket() {
            $("f-titulo").value = "";
            $("f-descripcion").value = "";
            $("f-categoria").value = "Otro";
            $("vista-exito").style.display = "none";
            $("vista-form").style.display = "block";
            $("f-titulo").focus();
        }

        (function precargarPersona() {
            try {
                const p = JSON.parse(localStorage.getItem("pedido_soporte_persona") || "null");
                if (p) { $("f-nombre").value = p.nombre || ""; $("f-puesto").value = p.puesto || ""; }
            } catch (e) {}
        })();
        cargarCatalogos();
    </script>
</body>
</html>
