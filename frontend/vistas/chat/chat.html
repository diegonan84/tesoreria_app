<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat | Tesorería</title>
    <link rel="stylesheet" href="/archivos/css/styles.css">
    <link rel="stylesheet" href="/archivos/css/chat.css">
</head>
<body>
    <nav class="navbar-ba" id="global-navbar"></nav>
    <aside class="sidebar-ba" id="global-sidebar"></aside>

    <div class="main-layout">
        <main class="chat-page">
            <div class="messenger" id="messenger">

            <!-- PANEL IZQUIERDO: LISTA DE CONVERSACIONES -->
            <aside class="messenger-lista">
                <div class="messenger-lista-header">
                    <strong style="font-size: 17px; color: #1a3644;">Chat</strong>
                    <input type="text" id="input-buscar-conversaciones" placeholder="Buscar conversación..." autocomplete="off">
                </div>
                <div class="messenger-lista-scroll">
                    <div id="lista-conversaciones"></div>
                    <div id="lista-vacia" style="display:none; text-align:center; color:#999; padding:30px 10px; font-size:13px;">
                        Todavía no tenés conversaciones.
                    </div>
                </div>
            </aside>

            <!-- PANEL DERECHO: CONVERSACIÓN -->
            <section class="messenger-pantalla">
                <div id="pantalla-vacia" style="height:100%; display:flex; align-items:center; justify-content:center; color:#b0bec5; font-size:15px; flex-direction:column; gap:8px;">
                    <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#c8d6df" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                    </svg>
                    <span>Elegí una conversación para empezar</span>
                </div>

                <div id="pantalla-conversacion" style="display:none; height:100%; flex-direction:column; min-height:0;">
                    <header class="messenger-conv-header">
                        <div class="messenger-avatar" id="avatar-activo" style="background:#58a598;">?</div>
                        <div style="flex-grow:1; min-width:0;">
                            <strong id="nombre-activo" style="color:#1a3644; font-size:15px;"></strong>
                            <div id="estado-activo" style="font-size:12px; color:#999;"></div>
                        </div>
                        <div class="conv-menu">
                            <button id="btn-menu-conv" class="messenger-btn-icon" title="Opciones">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                                    <circle cx="5" cy="12" r="1.7"></circle>
                                    <circle cx="12" cy="12" r="1.7"></circle>
                                    <circle cx="19" cy="12" r="1.7"></circle>
                                </svg>
                            </button>
                            <div id="menu-conversacion" class="conv-menu-dropdown" style="display:none;">
                                <button id="opcion-ver-perfil" class="conv-menu-opcion">👤 Ver perfil</button>
                                <button id="opcion-borrar-chat" class="conv-menu-opcion">🗑️ Borrar chat</button>
                            </div>
                        </div>
                    </header>

                    <div id="hilo-mensajes" class="messenger-hilo"></div>

                    <footer class="messenger-input-bar">
                        <div id="emoji-picker-page" class="messenger-emoji-picker" style="display:none;"></div>
                        <button id="btn-emojis-page" class="messenger-btn-icon" title="Emojis">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                                <line x1="9" y1="9" x2="9.01" y2="9"></line>
                                <line x1="15" y1="9" x2="15.01" y2="9"></line>
                            </svg>
                        </button>
                        <input type="text" id="input-mensaje" placeholder="Escribí un mensaje..." autocomplete="off">
                        <button id="btn-enviar" class="messenger-btn-enviar">Enviar</button>
                    </footer>
                </div>
            </section>
        </div>
        </main>
    </div>

    <!-- MODAL: VER PERFIL DEL CONTACTO -->
    <div id="modal-perfil" class="modal-overlay" style="display:none;">
        <div class="modal-perfil-box">
            <div style="text-align:right;">
                <button id="btn-cerrar-perfil" class="messenger-btn-icon" title="Cerrar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="perfil-avatar-grande" id="perfil-avatar">?</div>
            <h3 id="perfil-nombre" style="margin:12px 0 4px; color:#1a3644; text-align:center;"></h3>
            <div id="perfil-sector" class="perfil-linea"></div>
            <div id="perfil-estado" class="perfil-linea"></div>
            <div id="perfil-contacto" class="perfil-linea"></div>
        </div>
    </div>

    <script src="/archivos/js/app.js"></script>
    <script src="/archivos/js/notificaciones.js"></script>
    <script src="/archivos/js/chat_historial.js"></script>

</body>
</html>
