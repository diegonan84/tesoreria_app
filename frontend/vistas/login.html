<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="/archivos/css/login.css">
</head>
<body>
    <div class="contenedor-auth">
        <!-- PANEL IZQUIERDO: CLIMA + NOTICIAS RSS -->
        <div class="panel-izquierdo" style="display: flex; flex-direction: column; padding: 0; gap: 0; box-sizing: border-box; overflow: hidden;">
            
            <!-- 1/3: CLIMA Y FECHA -->
            <div style="flex: 0 0 auto; padding: 25px 25px 20px 25px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; border-bottom: 1px solid rgba(255,255,255,0.15);">
                
                <!-- Cabecera de Fecha y Hora -->
                <div style="text-align: center; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px;">
                    <span id="login-hora" style="font-size: 1.4rem; font-weight: bold; display: block;">--:--</span>
                    <span id="login-fecha" style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #9ee4d3;">Cargando...</span>
                </div>
                
                <!-- Clima Principal Actual -->
                <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 10px;">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <div id="clima-icono" style="font-size: 2.8rem; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3));">🌤️</div>
                        <div style="text-align: left;">
                            <div id="clima-desc" style="font-size: 0.9rem; color: #e0e6e8; font-weight: bold;">Cargando...</div>
                            <div id="clima-minmax" style="font-size: 0.8rem; color: #b8c2cc;">Min: --° | Máx: --°</div>
                        </div>
                    </div>
                    <div id="clima-temp" style="font-size: 2.8rem; font-weight: bold; line-height: 1; text-shadow: 1px 2px 5px rgba(0,0,0,0.3);">--°</div>
                </div>

                <!-- Pronóstico del día (Mañana / Tarde / Noche) -->
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 10px;">
                    <div>
                        <div style="font-size: 0.75rem; font-weight: bold; color: #9ee4d3; margin-bottom: 4px;">Mañana</div>
                        <div id="clima-icono-manana" style="font-size: 1.4rem; margin-bottom: 2px;">--</div>
                        <div id="clima-desc-manana" style="font-size: 0.65rem; color: #e0e6e8;">--</div>
                    </div>
                    <div>
                        <div style="font-size: 0.75rem; font-weight: bold; color: #9ee4d3; margin-bottom: 4px;">Tarde</div>
                        <div id="clima-icono-tarde" style="font-size: 1.4rem; margin-bottom: 2px;">--</div>
                        <div id="clima-desc-tarde" style="font-size: 0.65rem; color: #e0e6e8;">--</div>
                    </div>
                    <div>
                        <div style="font-size: 0.75rem; font-weight: bold; color: #9ee4d3; margin-bottom: 4px;">Noche</div>
                        <div id="clima-icono-noche" style="font-size: 1.4rem; margin-bottom: 2px;">--</div>
                        <div id="clima-desc-noche" style="font-size: 0.65rem; color: #e0e6e8;">--</div>
                    </div>
                </div>
            </div>

            <!-- 2/3: NOTICIAS RSS INFBAE -->
            <div style="flex: 1; padding: 15px 20px; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;">
                <h4 style="margin: 0 0 10px 0; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #9ee4d3; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 8px; text-align: left;">📰 Últimas Noticias</h4>
                <div id="contenedor-rss" style="overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 6px; flex-grow: 1;">
                    <div style="font-size: 0.85rem; color: #e0e6e8; text-align: center; margin-top: 20px;">Cargando noticias...</div>
                </div>
            </div>

        </div>

        <!-- PANEL DERECHO: FORMULARIO DE LOGIN -->
        <div class="panel-derecho">
            <div class="logo-login-container"><img src="/archivos/img/logo1.png" alt="Logo"></div>
            <h3>Iniciar Sesión</h3>
            <div class="grupo-input"><input type="email" id="email" placeholder="Email"></div>
            <div class="grupo-input"><input type="password" id="password" placeholder="Password"></div>
            <div class="opciones-secundarias">
                <label></label>
                <a href="/recuperar">¿Olvidó su contraseña?</a>
            </div>
            <button id="btn-login" class="btn-ingresar" onclick="hacerLogin()">INGRESAR</button>
            <p id="mensaje-login" class="mensaje-error"></p>
            <div class="enlace-registro">¿No tienes cuenta? <a href="/registro">Regístrate</a></div>
        </div>
    </div>
    
    <script src="/archivos/js/app.js"></script>
    <script src="/archivos/js/auth.js"></script>
    <script src="/archivos/js/login.js"></script>    
</body>
</html>
